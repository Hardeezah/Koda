[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLC"]
ignore = ["E501", "F841", "PLC0415", "W293"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
